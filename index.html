<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense and Budget Visualizer</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <h1>Expense Tracker</h1>
      <div id="balance-display">Total: $0.00</div>
    </header>

    <main>
      <section id="form-section">
        <form id="transaction-form" novalidate>
          <div class="form-group">
            <label for="item-name">Item Name</label>
            <input
              type="text"
              id="item-name"
              name="item-name"
              maxlength="100"
              placeholder="e.g. Lunch, Bus ticket"
              autocomplete="off"
            />
            <span id="error-name" class="error" role="alert"></span>
          </div>

          <div class="form-group">
            <label for="amount">Amount ($)</label>
            <input
              type="number"
              id="amount"
              name="amount"
              min="0.01"
              max="999999999.99"
              step="0.01"
              placeholder="0.00"
            />
            <span id="error-amount" class="error" role="alert"></span>
          </div>

          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category">
              <option value="">-- Select Category --</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Fun">Fun</option>
            </select>
            <span id="error-category" class="error" role="alert"></span>
          </div>

          <button type="submit">Add Transaction</button>
        </form>
      </section>

      <section id="list-section">
        <h2>Transactions</h2>
        <ul id="transaction-list" aria-label="Transaction list"></ul>
      </section>

      <section id="chart-section">
        <h2>Spending by Category</h2>
        <canvas id="pie-chart" aria-label="Spending distribution pie chart" role="img"></canvas>
        <p id="chart-placeholder" hidden>No spending data available.</p>
      </section>
    </main>

    <!-- Chart.js v4.5.1 UMD — must load before app.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
    <script src="js/app.js" defer></script>
  </body>
</html>
